<!DOCTYPE html>
<html lang="ko"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:v="urn:schemas-microsoft-com:vml"
      xmlns:o="urn:schemas-microsoft-com:office:office"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>DHC 청소 점검 결과</title>

    <!--[if mso]>
    <noscript>
        <xml>
            <o:OfficeDocumentSettings>
                <o:PixelsPerInch>96</o:PixelsPerInch>
            </o:OfficeDocumentSettings>
        </xml>
    </noscript>
    <![endif]-->

    <style>
        @font-face {
            font-family: 'Pretendard';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-Thin.woff2') format('woff2');
            font-weight: 100;
            font-display: swap;
        }

        @font-face {
            font-family: 'Pretendard';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-ExtraLight.woff2') format('woff2');
            font-weight: 200;
            font-display: swap;
        }

        @font-face {
            font-family: 'Pretendard';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-Light.woff2') format('woff2');
            font-weight: 300;
            font-display: swap;
        }

        @font-face {
            font-family: 'Pretendard';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-Regular.woff2') format('woff2');
            font-weight: 400;
            font-display: swap;
        }

        @font-face {
            font-family: 'Pretendard';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-Medium.woff2') format('woff2');
            font-weight: 500;
            font-display: swap;
        }

        @font-face {
            font-family: 'Pretendard';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-SemiBold.woff2') format('woff2');
            font-weight: 600;
            font-display: swap;
        }

        @font-face {
            font-family: 'Pretendard';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-Bold.woff2') format('woff2');
            font-weight: 700;
            font-display: swap;
        }

        @font-face {
            font-family: 'Pretendard';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-ExtraBold.woff2') format('woff2');
            font-weight: 800;
            font-display: swap;
        }

        @font-face {
            font-family: 'Pretendard';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-Black.woff2') format('woff2');
            font-weight: 900;
            font-display: swap;
        }

        body, table, td, div, p, a {
            -webkit-font-smoothing: antialiased;
        }

        body {
            margin: 0;
            padding: 0;
            width: 100% !important;
        }

        table {
            border-collapse: collapse;
        }

        img {
            border: 0;
            line-height: 100%;
            outline: none;
            text-decoration: none;
        }

        a {
            text-decoration: none;
        }
    </style>
</head>

<body style="margin:0; padding:0; background-color:#eeeff2; font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif;">

<table role="presentation"
       width="100%"
       cellpadding="0"
       cellspacing="0"
       border="0"
       style="background-color:#eeeff2;">

    <tr>
        <td align="center" style="padding:40px 16px;">

            <!-- Eyebrow -->
            <table role="presentation"
                   width="600"
                   cellpadding="0"
                   cellspacing="0"
                   border="0"
                   style="max-width:600px; width:100%;">
            </table>

            <!-- Card -->
            <table role="presentation"
                   width="600"
                   cellpadding="0"
                   cellspacing="0"
                   border="0"
                   style="max-width:600px;
                          width:100%;
                          background-color:#ffffff;
                          border:1px solid #dfe1e7;
                          border-radius:6px;">

                <!-- Accent stripe -->
                <tr>
                    <td style="background-color:#a3202c;
                               font-size:1px;
                               line-height:4px;
                               border-radius:6px 6px 0 0;">
                        &nbsp;
                    </td>
                </tr>

                <!-- Header -->
                <tr>
                    <td style="padding:26px 32px 22px 32px;">

                        <table role="presentation"
                               width="100%"
                               cellpadding="0"
                               cellspacing="0"
                               border="0">

                            <tr>

                                <td align="left" valign="middle">

                                    <table role="presentation"
                                           cellpadding="0"
                                           cellspacing="0"
                                           border="0">

                                        <tr>

                                            <td valign="middle"
                                                style="font-size:20px;
                                                       font-weight:800;
                                                       color:#14161c;
                                                       letter-spacing:-0.3px;">
                                                DHC
                                            </td>

                                            <td valign="middle"
                                                style="padding:0 12px;
                                                       color:#d7d9e0;
                                                       font-size:16px;">
                                                |
                                            </td>

                                            <td valign="middle"
                                                style="font-size:15px;
                                                       font-weight:500;
                                                       color:#565c6b;">
                                                청소 점검 결과
                                            </td>

                                        </tr>

                                    </table>

                                </td>

                                <td align="right" valign="middle">

                                    <table role="presentation"
                                           cellpadding="0"
                                           cellspacing="0"
                                           border="0"
                                           style="border:1.5px solid #a3202c;
                                                  border-radius:3px;
                                                  mso-padding-alt:6px 14px;">

                                        <tr>

                                            <td style="padding:6px 14px;
                                                       font-family:'SFMono-Regular',Menlo,Consolas,monospace;
                                                       font-size:12px;
                                                       font-weight:700;
                                                       letter-spacing:1.5px;
                                                       color:#a3202c;
                                                       white-space:nowrap;"
                                                th:text="${passed ? 'PASS · 통과' : 'FAIL · 미통과'}">
                                                FAIL · 미통과
                                            </td>

                                        </tr>

                                    </table>

                                </td>

                            </tr>

                        </table>

                    </td>
                </tr>

                <!-- Divider -->
                <tr>
                    <td style="padding:0 32px;">

                        <table role="presentation"
                               width="100%"
                               cellpadding="0"
                               cellspacing="0"
                               border="0">

                            <tr>
                                <td style="border-top:1px solid #ecedf1;
                                           font-size:1px;
                                           line-height:1px;">
                                    &nbsp;
                                </td>
                            </tr>

                        </table>

                    </td>
                </tr>

                <!-- Status message -->
                <tr>
                    <td style="padding:26px 32px 4px 32px;">

                        <table role="presentation"
                               width="100%"
                               cellpadding="0"
                               cellspacing="0"
                               border="0">

                            <tr>

                                <td width="46" valign="top">

                                    <table role="presentation"
                                           width="40"
                                           height="40"
                                           cellpadding="0"
                                           cellspacing="0"
                                           border="0"
                                           style="border:1.5px solid #a3202c;
                                                  border-radius:4px;">

                                        <tr>

                                            <td align="center"
                                                valign="middle"
                                                style="font-size:18px;
                                                       font-weight:700;
                                                       color:#a3202c;"
                                                th:text="${passed ? '✓' : '✕'}">
                                                &#10005;
                                            </td>

                                        </tr>

                                    </table>

                                </td>

                                <td valign="middle" style="padding-left:14px;">

                                    <p style="margin:0 0 5px 0;
                                              font-size:18px;
                                              font-weight:700;
                                              color:#14161c;
                                              letter-spacing:-0.2px;"
                                       th:text="${passed ? '청소가 완료되었습니다' : '청소가 완료되지 않았습니다'}">
                                        청소가 완료되지 않았습니다
                                    </p>

                                    <p style="margin:0;
                                              font-size:13px;
                                              color:#868c98;"
                                       th:text="${passed ? '청소 상태가 정상적으로 확인되었습니다.' : '아래 미청소 항목을 확인해주세요.'}">
                                        아래 미청소 항목을 확인해주세요.
                                    </p>

                                </td>

                            </tr>

                        </table>

                    </td>
                </tr>

                <!-- 미청소 항목 -->
                <tr th:if="${!passed}">
                    <td style="padding:22px 32px 4px 32px;">

                        <table role="presentation"
                               width="100%"
                               cellpadding="0"
                               cellspacing="0"
                               border="0"
                               style="border-left:2px solid #a3202c;
                                      background-color:#fafafa;">

                            <tr>

                                <td style="padding:14px 16px 14px 18px;">

                                    <table role="presentation"
                                           cellpadding="0"
                                           cellspacing="0"
                                           border="0"
                                           width="100%">

                                        <tr>

                                            <td style="font-family:'SFMono-Regular',Menlo,Consolas,monospace;
                                                       font-size:10.5px;
                                                       letter-spacing:0.8px;
                                                       color:#a3202c;
                                                       text-transform:uppercase;
                                                       padding-bottom:10px;">
                                                미청소 항목
                                            </td>

                                        </tr>

                                        <tr>

                                            <td>

                                                <table role="presentation"
                                                       cellpadding="0"
                                                       cellspacing="0"
                                                       border="0">

                                                    <tr>

                                                        <td style="padding:0 8px 8px 0;">

                                                            <table role="presentation"
                                                                   cellpadding="0"
                                                                   cellspacing="0"
                                                                   border="0"
                                                                   style="border:1px solid #e3c4c6;
                                                                          border-radius:3px;">

                                                                <tr>

                                                                    <td style="padding:5px 10px;
                                                                               font-size:12.5px;
                                                                               font-weight:600;
                                                                               color:#2a2c33;"
                                                                        th:text="${reason}">
                                                                        미청소 항목
                                                                    </td>

                                                                </tr>

                                                            </table>

                                                        </td>

                                                    </tr>

                                                </table>

                                            </td>

                                        </tr>

                                    </table>

                                </td>

                            </tr>

                        </table>

                    </td>
                </tr>

                <!-- Info table -->
                <tr>
                    <td style="padding:22px 32px 4px 32px;">

                        <table role="presentation"
                               width="100%"
                               cellpadding="0"
                               cellspacing="0"
                               border="0"
                               style="border:1px solid #ecedf1;
                                      border-radius:4px;">

                            <!-- 이름 -->
                            <tr>

                                <td style="padding:14px 18px;
                                           border-bottom:1px solid #f0f1f4;
                                           font-family:'SFMono-Regular',Menlo,Consolas,monospace;
                                           font-size:10.5px;
                                           letter-spacing:0.8px;
                                           color:#9297a1;
                                           text-transform:uppercase;"
                                    width="40%">
                                    이름
                                </td>

                                <td align="right"
                                    style="padding:14px 18px;
                                           border-bottom:1px solid #f0f1f4;
                                           font-size:14px;
                                           font-weight:700;
                                           color:#14161c;"
                                    th:text="${name}">
                                    홍길동
                                </td>

                            </tr>

                            <!-- 청소 여부 -->
                            <tr>

                                <td style="padding:14px 18px;
                                           border-bottom:1px solid #f0f1f4;
                                           font-family:'SFMono-Regular',Menlo,Consolas,monospace;
                                           font-size:10.5px;
                                           letter-spacing:0.8px;
                                           color:#9297a1;
                                           text-transform:uppercase;">
                                    청소 여부
                                </td>

                                <td align="right"
                                    style="padding:14px 18px;
                                           border-bottom:1px solid #f0f1f4;
                                           font-size:14px;
                                           font-weight:700;
                                           color:#a3202c;"
                                    th:text="${passed ? '완료' : '미완료'}">
                                    미완료
                                </td>

                            </tr>

                            <!-- 청소자 호실 -->
                            <tr>

                                <td style="padding:14px 18px;
                                           border-bottom:1px solid #f0f1f4;
                                           font-family:'SFMono-Regular',Menlo,Consolas,monospace;
                                           font-size:10.5px;
                                           letter-spacing:0.8px;
                                           color:#9297a1;
                                           text-transform:uppercase;">
                                    청소자 호실
                                </td>

                                <td align="right"
                                    style="padding:14px 18px;
                                           border-bottom:1px solid #f0f1f4;
                                           font-size:14px;
                                           font-weight:700;
                                           color:#14161c;"
                                    th:text="${room}">
                                    A-101
                                </td>

                            </tr>

                            <!-- 날짜 -->
                            <tr>

                                <td style="padding:14px 18px;
                                           font-family:'SFMono-Regular',Menlo,Consolas,monospace;
                                           font-size:10.5px;
                                           letter-spacing:0.8px;
                                           color:#9297a1;
                                           text-transform:uppercase;">
                                    날짜
                                </td>

                                <td align="right"
                                    style="padding:14px 18px;
                                           font-size:14px;
                                           font-weight:700;
                                           color:#14161c;"
                                    th:text="${date}">
                                    2024.05.21 (화) 10:30
                                </td>

                            </tr>

                        </table>

                    </td>
                </tr>

                <!-- Footer -->
                <tr>

                    <td style="padding:26px 32px 26px 32px;">

                        <table role="presentation"
                               width="100%"
                               cellpadding="0"
                               cellspacing="0"
                               border="0"
                               style="border-top:1px solid #ecedf1;">

                            <tr>

                                <td style="padding-top:18px;
                                           font-family:'SFMono-Regular',Menlo,Consolas,monospace;
                                           font-size:10.5px;
                                           letter-spacing:0.6px;
                                           color:#9297a1;
                                           text-transform:uppercase;">
                                    DHC 청소 관리 시스템
                                </td>

                            </tr>

                            <tr>

                                <td style="padding-top:6px;
                                           font-size:12px;
                                           line-height:18px;
                                           color:#868c98;">
                                    본 메일은 자동으로 발송되었습니다.
                                    문의사항이 있으시면 관리자에게 문의해주세요.
                                </td>

                            </tr>

                        </table>

                    </td>

                </tr>

            </table>

        </td>
    </tr>

</table>

</body>
</html>
